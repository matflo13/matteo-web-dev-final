<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Pizza | Pizza Hotline</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
  </head>
  <body>
    <header>
      <a href="index.html">
        <img
          src="images/pizza-hotline-logo.png"
          alt="Pizza Hotline Logo"
          id="logo" />
      </a>
      <nav id="navbar">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="locations.html">Locations</a></li>
          <li><a href="fundraising.html">Fundraising</a></li>
          <li><a href="about-us.html">About Us</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="text-box">
        <h2>Where are we delivering to?</h2>
        <a href="address.html" class="button">Enter Address</a>
      </section>

      <section class="deals">
        <h2>Fresh Deals</h2>
        <div class="deal-content">
          <figure>
            <img src="images/cheese-pizza.jpg" alt="A cheese pizza." />
            <figcaption> Buy One Cheese Pizza, Get One Free </figcaption>
          </figure>
          <figure>
            <img src="images/pizza-toppings.jpg" alt="A pizza with many toppings." />
            <figcaption> Two Free Extra Toppings on Any XL Pizza</figcaption>
          </figure>
          <figure>
            <img src="images/pizza-meal.jpg" alt="A meal including a box of pizza, salad, and a can of soda." />
            <figcaption>Medium Pizza, Drink and Side for only $11.99</figcaption>
          </figure>
        </div>
      </section>
    </main>
    <footer>
      <p> &#169;Pizza Hotline, used under license. &#169;Pizza Hotline 2026.</p>
    </br>
      <p>Pizza images generated using Canva AI.</p>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Menu | Pizza Hotline</title>
    <!-- Links to the external stylesheet. -->
    <link rel="stylesheet" href="stylesheets/style.css" />
    <style>
      .pricing {
        font-weight: bolder;
        color: #a41919
      }
    </style>
  </head>
  <body>
    <!-- Same header as the rest of the pages. -->
    <header>
      <a href="index.html">
        <img
          src="images/pizza-hotline-logo.png"
          alt="Pizza Hotline Logo"
          id="logo" />
      </a>
      <nav id="navbar">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="locations.html">Locations</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="about-us.html">About Us</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="text-box">
        <h2>Our Menu</h2>
        <p>View our extensive collection of items to enjoy!</p>
      </section>
      <!-- This is the container surrounding all the menu items. -->
      <section class="text-box">
        <h2>Pizzas</h2>
        <!-- This is the class for each card. Each figure is a card with the image and caption on it. -->
        <div class="deal-content">
          <figure>
            <img
              src="images/italian-classic.jpg"
              alt="Italian Classic pizza." />
            <figcaption>
              Italian Classic
              </br>
              <span class="pricing">
                $11.99
              </span>
            </figcaption>
          </figure>
          <figure>
            <img
              src="images/primo-suprimo.jpg"
              alt="Primo Suprimo pizza." />
            <figcaption>
              Primo Suprimo
              </br>
              <span class="pricing">
                $13.99
              </span>
            </figcaption>
          </figure>
          <figure>
            <img src="images/mediterranean.jpg" alt="Mediterranean pizza." />
            <figcaption>
              Mediterranean
              </br>
              <span class="pricing">
                $12.99
              </span>
            </figcaption>
          </figure>
          <figure>
            <img
              src="images/the-greek.jpg"
              alt="Greek pizza." />
            <figcaption>
              "The Greek"
              </br>
              <span class="pricing">
                $13.99
              </span>
            </figcaption>
          </figure>
          <figure>
            <img
              src="images/meaty-delight.jpg"
              alt="Meaty Delight pizza." />
            <figcaption>
              Meaty Delight
              </br>
              <span class="pricing">
                $14.99
              </span>
            </figcaption>
          </figure>
          <figure>
            <img src="images/garden-veggie.jpg" alt="Garden Veggie pizza." />
            <figcaption>
              Garden Veggie
              </br>
              <span class="pricing">
                $11.99
              </span>
            </figcaption>
          </figure>
        </div>
      </section>

      <section class="text-box">
        <h2>Sides</h2>
        <!-- This is the class for each card. Each figure is a card with the image and caption on it. -->
        <div class="deal-content">
          <figure>
            <img
              src="images/garlic-bread.jpg"
              alt="Garlic Bread." />
            <figcaption>
              Garlic Bread
              </br>
              <span class="pricing">
                $4.99
              </span>
            </figcaption>
          </figure>
          <figure>
            <img
              src="images/cheese-sticks.jpg"
              alt="Cheese Sticks." />
            <figcaption>
              Cheese Sticks
              </br>
              S: <span class="pricing">$7.99 </span>M: <span class="pricing">$12.99 </span>L: <span class="pricing">$15.99</span>
              </span>
            </figcaption>
          </figure>
          <figure>
            <img
              src="images/breadsticks.jpg"
              alt="Breadsticks." />
            <figcaption>
              Breadsticks
              </br>
              S: <span class="pricing">$5.49 </span>M: <span class="pricing">$7.99 </span>L: <span class="pricing">$9.99</span>
              </span>
            </figcaption>
          </figure>
        </div>
      </section>

      <section class="text-box">
        <h2>Salads</h2>
        <!-- This is the class for each card. Each figure is a card with the image and caption on it. -->
        <div class="deal-content">
          <figure>
            <img
              src="images/caesar-salad.jpg"
              alt="Caesar Salad." />
            <figcaption>
              Caesar
              </br>
              <span class="pricing">
              Side: <span class="pricing">$5.49 </span>Family: <span class="pricing">$11.99 </span>
              </span>
            </figcaption>
          </figure>
          <figure>
            <img
              src="images/greek-salad.jpg"
              alt="Greek Salad." />
            <figcaption>
              Greek Salad
              </br>
              Side: <span class="pricing">$5.49 </span>Family: <span class="pricing">$11.99 </span>
              </span>
            </figcaption>
          </figure>
          <figure>
            <img
              src="images/tossed-salad.jpg"
              alt="Tossed Salad." />
            <figcaption>
              Tossed
              </br>
              Side: <span class="pricing">$5.49 </span>Family: <span class="pricing">$11.99 </span>
              </span>
            </figcaption>
          </figure>
        </div>
      </section>

      <section class="text-box">
        <h2>Drinks</h2>
        <!-- This is the class for each card. Each figure is a card with the image and caption on it. -->
        <div class="deal-content">
          <figure>
            <img
              src="images/canned-pop.jpg"
              alt="Canned Pop." />
            <figcaption>
              Canned Pop
              </br>
              <span class="pricing">
              $1.69
              </span>
            </figcaption>
          </figure>
          <figure>
            <img
              src="images/two-liter.jpg"
              alt="Two liter bottle of pop." />
            <figcaption>
              2L Pop
              </br>
              <span class="pricing">
              $3.99
              </span>
            </figcaption>
          </figure>
          <figure>
            <img
              src="images/six-pack-pop.jpg"
              alt="Six-Pack of Pop." />
            <figcaption>
              Pop 6-Pack
              </br>
              <span class="pricing">
              $6.99
              </span>
            </figcaption>
          </figure>
        </div>
      </section>
      <!-- This is the back to top button. &#8593; is the HTML entity for an up arrow. -->
      <a href="#top" id="back-to-top" title="Back to Top">&#8593;</a>
    </main>
    <!-- Same exact footer as all other pages. -->
    <footer>
      <h2 style="margin-top: 15px; margin-bottom: 15px">Pizza Hotline</h2>
      <div id="social-icons-bar">
        <a href="https://www.youtube.com/@PizzaHotline22" target="_blank">
          <img
            src="images/youtube.png"
            alt="Youtube logo"
            class="social-icons" />
        </a>
        <a href="https://www.instagram.com/pizzahotline22/" target="_blank">
          <img
            src="images/insta.png"
            alt="Instagram logo"
            class="social-icons" />
        </a>
        <a href="https://x.com/PizzaHotline22" target="_blank">
          <img
            src="images/twitter-x.png"
            alt="X (formerly Twitter) logo"
            class="social-icons" />
        </a>
        <a href="https://www.facebook.com/pizzahotline22/" target="_blank">
          <img
            src="images/facebook.png"
            alt="Facebook logo"
            class="social-icons" />
        </a>
      </div>
      <p>&#169;Pizza Hotline, used under license. &#169;Pizza Hotline 2026.</p>
      <p>Pizza images generated using Canva AI.</p>
    </footer>
  </body>
</html>
